<script>
  /*
   * Classic script, so it runs even when the module graph cannot load.
   * Browsers block ES modules on file:// URLs, which would otherwise leave
   * the preloader spinning forever with no explanation.
   */
  (function () {
    var host = document.getElementById("preloaderInner");

    function explain(heading, body, code) {
      if (window.__portfolioBooted || !host) return;

      host.innerHTML =
        '<div class="preloader__mark">MHY</div>' +
        '<h1 class="preloader__error-title">' + heading + "</h1>" +
        '<p class="preloader__note">' + body + "</p>" +
        (code ? '<code class="preloader__code">' + code + "</code>" : "");
    }

    if (location.protocol === "file:") {
      explain(
        "Serve this over HTTP",
        "The 3D layer uses ES modules, which browsers refuse to load from a file:// URL. " +
          "Run a local server from this folder, then open <strong>http://localhost:5173</strong>.",
        "python -m http.server 5173"
      );
      return;
    }

    // Anything else that stops the page booting: a blocked CDN, an offline
    // machine, or a script error.
    setTimeout(function () {
      explain(
        "Something did not load",
        "This site pulls Three.js, GSAP and Lenis from a CDN. Check your connection or " +
          "any content blockers, then reload."
      );
    }, 9000);
  })();
</script>
